# ============================================================
# LottoIQ — netlify.toml
# ============================================================

[build]
  publish   = "website"
  functions = "website/netlify/functions"
  command	= ""
 
[functions]
  node_bundler = "esbuild"


# ── Redirects ─────────────────────────────────────────────────

[[redirects]]
  from   = "/api/draws"
  to     = "/.netlify/functions/draws"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/log-generated"
  to     = "/.netlify/functions/log-generated"
  status = 200
  force  = true


# ── Security Headers ──────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.bunny.net; font-src https://fonts.gstatic.com https://fonts.bunny.net; connect-src 'self' https://js.stripe.com https://hooks.stripe.com https://nnhvhqggaxfraqmkkehg.supabase.co; img-src 'self' data:; frame-src https://js.stripe.com https://hooks.stripe.com;"


# ── Cache Headers ─────────────────────────────────────────────

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/games/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
